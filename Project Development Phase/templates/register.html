<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - PocketSmart AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow border-0 p-5 rounded-4" style="width: 420px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-success">Create Your Account</h3>
            <p class="text-muted small">Start managing budgets with Gemini AI</p>
        </div>
        <form id="registerForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="reg_username" required placeholder="Choose a username">
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="reg_email" required placeholder="Enter your email">
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="reg_password" required placeholder="Create a strong password">
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Register</button>
        </form>
        <div class="text-center mt-3">
            <small class="text-muted">Already have an account? <a href="/login">Sign In</a></small>
        </div>
    </div>

   <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                username: document.getElementById('reg_username').value,
                email: document.getElementById('reg_email').value,
                password: document.getElementById('reg_password').value
            };

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alert('Account created successfully! Please sign in.');
                    window.location.href = '/login';
                } else {
                    alert(data.detail || 'Registration failed.');
                }
            } catch (err) {
                alert('Connection error. Please try again.');
            }
        });
    </script>
</body>
</html>
