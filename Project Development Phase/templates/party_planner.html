<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Budget Planner - PocketSmart AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">PocketSmart</a>
            <a class="text-white text-decoration-none btn btn-outline-light btn-sm" href="/dashboard">Dashboard</a>
        </div>
    </nav>

    <div class="container py-4">
        <div class="text-center mb-5">
            <h2 class="fw-bold text-info">Party Budget Planner</h2>
            <p class="text-muted">Plan your perfect event with AI-powered budget recommendations</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow border-0 p-4 mb-5 rounded-4">
                    <form id="partyBudgetForm">
                        <h5 class="mb-3 text-info border-bottom pb-2">Basic Information</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Total Budget (₹)</label>
                                <input type="number" class="form-control" id="total_budget" required placeholder="e.g. 15000">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Number of Guests</label>
                                <input type="number" class="form-control" id="num_guests" required value="10">
                            </div>
                        </div>

                        <h5 class="mb-3 text-info border-bottom pb-2">Event Details</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Party Type</label>
                                <input type="text" class="form-control" id="party_type" required placeholder="e.g. Birthday, Anniversary">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Venue Type</label>
                                <input type="text" class="form-control" id="venue_type" placeholder="e.g. Home, Banquet Hall">
                            </div>
                        </div>

                        <h5 class="mb-3 text-info border-bottom pb-2">Party Needs</h5>
                        <div class="d-flex gap-4 mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="needs_catering">
                                <label class="form-check-label">Catering</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="needs_decoration">
                                <label class="form-check-label">Decoration</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="needs_entertainment">
                                <label class="form-check-label">Entertainment</label>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Additional Requirements</label>
                            <textarea class="form-control" id="additional_requirements" rows="2" placeholder="Special themes, dietary restrictions..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-info text-white w-100 py-3 fw-bold fs-5">Generate Budget Plan</button>
                    </form>
                </div>

                <div id="resultContainer" class="d-none mt-5">
                    <h3 class="text-center mb-4 fw-bold">Your Party Budget Plan</h3>
                    <div id="aiOutput"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('partyBudgetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Constructing the JSON payload matching the Pydantic schema
            const payload = {
                total_budget: parseFloat(document.getElementById('total_budget').value),
                party_type: document.getElementById('party_type').value,
                num_guests: parseInt(document.getElementById('num_guests').value),
                venue_type: document.getElementById('venue_type').value,
                needs_catering: document.getElementById('needs_catering').checked,
                needs_decoration: document.getElementById('needs_decoration').checked,
                needs_entertainment: document.getElementById('needs_entertainment').checked,
                additional_requirements: document.getElementById('additional_requirements').value
            };

            const resultContainer = document.getElementById('resultContainer');
            const aiOutput = document.getElementById('aiOutput');
            resultContainer.classList.remove('d-none');
            aiOutput.innerHTML = '<div class="text-center my-5"><div class="spinner-grow text-info" role="status"></div><h5 class="mt-3 text-muted">Gemini 1.5 Flash Pro is orchestrating your event...</h5></div>';

            try {
                // Initiating POST request to FastAPI backend[cite: 4]
                const response = await fetch('/party-budget', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (data.error) throw new Error(data.error);

                let html = `<div class="card border-info mb-4 shadow"><div class="card-body text-center bg-info text-white rounded-top"><h4 class="mb-0">Total Allocated Budget: ₹${data.total_budget}</h4></div></div>`;
                
                data.budget_breakdown.forEach(category => {
                    html += `<div class="card mb-4 shadow-sm border-0"><div class="card-header bg-dark text-white text-capitalize py-3 fw-bold fs-5"><i class="bi bi-tag-fill me-2"></i>${category.category} Segment (₹${category.allocation})</div><div class="card-body p-0"><ul class="list-group list-group-flush">`;
                    
                    category.items.forEach(item => {
                        html += `
                            <li class="list-group-item p-4">
                                <div class="row align-items-center">
                                    <div class="col-md-7">
                                        <h5 class="fw-bold mb-1">${item.name}</h5>
                                        <p class="text-muted mb-0 small">${item.description || 'Recommended element for your event.'}</p>
                                    </div>
                                    <div class="col-md-2 text-end">
                                        <span class="badge bg-success fs-6">₹${item.estimated_price}</span>
                                    </div>
                                    <div class="col-md-3 text-end">
                                        <!-- Dynamic rendering of Indian E-commerce platforms[cite: 4] -->
                                        ${item.shopping_links && item.shopping_links.swiggy ? `<a href="${item.shopping_links.swiggy}" target="_blank" class="btn btn-sm btn-outline-warning mb-1 w-100">Swiggy</a>` : ''}
                                        ${item.shopping_links && item.shopping_links.zomato ? `<a href="${item.shopping_links.zomato}" target="_blank" class="btn btn-sm btn-outline-danger mb-1 w-100">Zomato</a>` : ''}
                                        ${item.shopping_links && item.shopping_links.oyo ? `<a href="${item.shopping_links.oyo}" target="_blank" class="btn btn-sm btn-outline-danger w-100">OYO</a>` : ''}
                                    </div>
                                </div>
                            </li>`;
                    });
                    html += `</ul></div></div>`;
                });
                aiOutput.innerHTML = html;
            } catch (error) {
                aiOutput.innerHTML = `<div class="alert alert-danger shadow"><h4 class="alert-heading">Processing Error</h4><p>Unable to connect to the Gemini recommendation engine. Please verify your API key or network connection.</p></div>`;
            }
        });
    </script>
</body>
</html>
