<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - PocketSmart AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">PocketSmart Dashboard</a>
            <div class="collapse navbar-collapse justify-content-end">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/history">History</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="/logout">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="bg-primary text-white p-5 rounded-4 shadow-lg text-center mb-5">
            <h1 class="display-5 fw-bold">Welcome Back!</h1>
            <p class="lead">Choose a budget planner to continue your personalized financial planning experience.</p>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <a href="/home-planner" class="text-decoration-none">
                    <div class="card h-100 shadow-sm border-0 border-bottom border-primary border-5 hover-effect">
                        <div class="card-body p-4 text-center">
                            <h2 class="display-4 mb-3">🏠</h2>
                            <h4 class="text-dark fw-bold">Home Planner</h4>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="/party-planner" class="text-decoration-none">
                    <div class="card h-100 shadow-sm border-0 border-bottom border-info border-5 hover-effect">
                        <div class="card-body p-4 text-center">
                            <h2 class="display-4 mb-3">🎉</h2>
                            <h4 class="text-dark fw-bold">Party Planner</h4>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="/jewelry-planner" class="text-decoration-none">
                    <div class="card h-100 shadow-sm border-0 border-bottom border-warning border-5 hover-effect">
                        <div class="card-body p-4 text-center">
                            <h2 class="display-4 mb-3">💎</h2>
                            <h4 class="text-dark fw-bold">Jewelry Planner</h4>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <div class="card shadow border-0 rounded-4">
            <div class="card-header bg-white py-3 border-bottom-0">
                <h4 class="mb-0 fw-bold text-secondary"><i class="bi bi-clock-history me-2"></i>Recent Activity</h4>
            </div>
            <div class="card-body p-0">
                <div class="list-group list-group-flush" id="recentActivityList">
                    
                    <div class="p-4 text-center text-muted">
                        <p class="mb-0">Loading recent budget generation history...</p>
                    </div>
                </div>
            </div>
            <div class="card-footer bg-white text-center py-3">
                <a href="/history" class="btn btn-sm btn-outline-secondary">View Complete History Log</a>
            </div>
        </div>
    </div>
</body>
</html>
