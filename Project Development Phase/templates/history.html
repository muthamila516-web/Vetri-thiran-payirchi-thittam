<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendation History - PocketSmart AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard">PocketSmart Dashboard</a>
            <a class="text-white text-decoration-none btn btn-outline-light btn-sm" href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container py-4">
        <div class="text-center mb-5">
            <h2 class="fw-bold text-secondary">Your Recommendation History</h2>
            <p class="text-muted">View and manage all your previous budget plans and recommendations</p>
        </div>
        <div class="row g-4" id="historyGrid">
            <div class="col-12 text-center text-muted py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Fetching history records...</p>
            </div>
        </div>
    </div>
</body>
</html>
